[project]
name = "geniza"
version = "0.0.1"
description = "One-way mail archiver into a borg-friendly, searchable local store"
authors = [{ name = "Luis Pedro Coelho", email = "luis@luispedro.org" }]
requires-python = ">=3.15"
dependencies = ["imapclient", "cryptography"]

[project.scripts]
geniza = "geniza.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geniza"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.15.*"
imapclient = "*"
cryptography = "*"

[tool.pixi.pypi-dependencies]
geniza = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
hypothesis = "*"
zstd = "*"
openssh = "*"

[tool.pixi.feature.lint.dependencies]
ruff = "*"
mypy = "*"

[tool.pixi.environments]
default = { features = ["test", "lint"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check src tests && ruff format --check src tests"
fmt = "ruff format src tests && ruff check --fix src tests"
typecheck = "mypy src"
geniza = "python -m geniza"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Header templates are clearer kept on one line.
"tests/corpus/generate.py" = ["E501"]

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src"
